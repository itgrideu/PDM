<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDM flow</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #ffffff;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  }
  .toolrow {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 28px;
    padding: 0 2px 10px 2px;
  }
  .backlink {
    display: none;
    align-items: center;
    gap: 6px;
    color: #0078d4;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    user-select: none;
  }
  .backlink.show { display: inline-flex; }
  .backlink:hover { text-decoration: underline; }
  .homelink {
    display: none;
    align-items: center;
    gap: 6px;
    color: #0078d4;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    user-select: none;
  }
  .homelink.show { display: inline-flex; }
  .homelink:hover { text-decoration: underline; }
  .sep { color: #c8c6c4; font-size: 13px; }
  .crumb {
    color: #605e5c;
    font-size: 13px;
  }
  .crumb b { color: #201f1e; font-weight: 600; }
  .level { display: none; position: relative; }
  .level.active { display: block; }
  .zoom-viewport {
    position: relative;
    width: 100%;
    overflow-x: auto;
    overflow-y: visible;
    touch-action: pan-y;
    border-radius: 6px;
  }
  .zoom-viewport.panning { cursor: grabbing; }
  .zoom-viewport.zoomed { cursor: grab; }
  .diagram-wrap {
    position: relative;
    width: 100%;
    max-width: 1200px;
  }
  .diagram-img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .zoom-controls {
    position: fixed;
    right: 14px;
    bottom: 14px;
    display: flex;
    align-items: center;
    gap: 2px;
    background: #ffffff;
    border: 1px solid #e1dfdd;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    padding: 3px;
    z-index: 20;
    user-select: none;
  }
  .zoom-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    color: #323130;
    font-size: 16px;
    cursor: pointer;
    border-radius: 4px;
    line-height: 1;
  }
  .zoom-btn:hover { background: #f3f2f1; }
  .zoom-reset {
    font-size: 11px;
    color: #605e5c;
    min-width: 40px;
    text-align: center;
    cursor: pointer;
    border-radius: 4px;
    padding: 4px 2px;
  }
  .zoom-reset:hover { background: #f3f2f1; }
  .hotspot {
    position: absolute;
    cursor: pointer;
    border-radius: 4px;
    outline: none;
    transition: background-color 0.12s ease, box-shadow 0.12s ease;
  }
  .hotspot:hover, .hotspot:focus {
    background-color: rgba(0, 120, 212, 0.12);
    box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.55) inset;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: #323130;
    color: #fff;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
const LINKS = {
  "PRO_SAL_001": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo",
  "PRO_SAL_002": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_SAL_002_Sales%20aanvragen%20voortraject.aspx",
  "PRO_SAL_003": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_SAL_003_Uitwerken%20basisofferte.aspx",
  "PRO_SAL_004": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_SAL_004_Uitwerken%20complexe%20offerte.aspx",
  "PRO_SAL_005": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_SAL_005_Projectadministratie.aspx",
  "PRO_FOPS_001": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_FOPS_001_Projectopstart.aspx",
  "PRO_FOPS_002": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_FOPS_002_Uitvoer%20project.aspx",
  "PRO_FOPS_003": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_FOPS_003_Projectoplevering.aspx",
  "PRO_FOPS_004": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_FOPS_004_Nazorg%20Project.aspx",
  "PRO_EE_001": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_EE_001_Electrical%20Engineering.aspx",
  "PRO_SWE_001": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo",
  "P_PUR_001": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_SC_001_Bestellen-en-ontvangen-materiaal.aspx",
  "PRO_PAN_001": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_PAN_001_Projectopstart.aspx?",
  "PRO_PAN_002": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_PAN_002_E-plan%20Engineering.aspx",
  "PRO_PAN_003": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_PAN_003_Uitvoer%20project.aspx",
  "PRO_PAN_004": "https://cksbvba678.sharepoint.com/sites/itgridpdmdemo/SitePages/PRO_PAN_004_Projectoplevering.aspx"
};
const LEVEL_NAMES = {
  "hoofdflow": "Hoofdflow",
  "sales": "Sales en calculatie",
  "fops": "Uitvoer Field Operations",
  "pan": "Uitvoer Panels"
};
let navHistory = ['hoofdflow'];

function showLevel(id, push) {
  document.querySelectorAll('.level').forEach(function(el) {
    el.classList.toggle('active', el.id === 'level-' + id);
  });
  document.getElementById('crumb').innerHTML = '<b>' + LEVEL_NAMES[id] + '</b>';
  var homeBtn = document.getElementById('homeBtn');
  var sep2 = document.getElementById('sep2');
  var showHome = id !== 'hoofdflow';
  homeBtn.classList.toggle('show', showHome);
  sep2.style.display = showHome ? 'inline' : 'none';
  if (push) {
    navHistory.push(id);
  }
  resetZoom(id);
}

// ---- zoom & pan: zooming in grows the actual canvas, so more real estate becomes scrollable ----
const NATIVE_WIDTHS = {"hoofdflow": 4435, "sales": 4938, "fops": 5959, "pan": 3919};
const ZOOM_MIN = 1, ZOOM_MAX = 4, ZOOM_STEP = 1.3;
const zoomState = {};
['hoofdflow','sales','fops','pan'].forEach(function(lvl) {
  zoomState[lvl] = { scale: 1 };
});
let suppressClick = false;

function baseWidth(lvl) {
  var vp = document.getElementById('viewport-' + lvl);
  return Math.min(vp.clientWidth, NATIVE_WIDTHS[lvl]);
}

function updateLabel(lvl) {
  var st = zoomState[lvl];
  var vp = document.getElementById('viewport-' + lvl);
  vp.classList.toggle('zoomed', st.scale > 1.001);
  var label = document.querySelector('#level-' + lvl + ' .zoom-reset');
  if (label) label.textContent = Math.round(st.scale * 100) + '%';
}

function zoomAt(lvl, factor, px) {
  var st = zoomState[lvl];
  var vp = document.getElementById('viewport-' + lvl);
  var wrap = document.getElementById('wrap-' + lvl);
  if (px === undefined) px = vp.clientWidth / 2;
  var s0 = st.scale;
  var s1 = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, s0 * factor));
  if (s1 === s0) return;
  var base = baseWidth(lvl);
  var contentX = (vp.scrollLeft + px) / s0; // anchor point in unscaled content units
  st.scale = s1;
  if (s1 <= 1.001) {
    resetZoom(lvl);
    return;
  }
  wrap.style.maxWidth = 'none';
  wrap.style.width = (base * s1) + 'px';
  vp.scrollLeft = contentX * s1 - px;
  updateLabel(lvl);
}

function resetZoom(lvl) {
  zoomState[lvl] = { scale: 1 };
  var vp = document.getElementById('viewport-' + lvl);
  var wrap = document.getElementById('wrap-' + lvl);
  wrap.style.width = '100%';
  wrap.style.maxWidth = NATIVE_WIDTHS[lvl] + 'px';
  vp.scrollLeft = 0;
  updateLabel(lvl);
}

['hoofdflow','sales','fops','pan'].forEach(function(lvl) {
  var vp = document.getElementById('viewport-' + lvl);
  var levelEl = document.getElementById('level-' + lvl);

  levelEl.querySelector('[data-zoomin]').addEventListener('click', function() { zoomAt(lvl, ZOOM_STEP); });
  levelEl.querySelector('[data-zoomout]').addEventListener('click', function() { zoomAt(lvl, 1 / ZOOM_STEP); });
  levelEl.querySelector('[data-zoomreset]').addEventListener('click', function() { resetZoom(lvl); });

  vp.addEventListener('wheel', function(e) {
    if (!e.ctrlKey && !e.metaKey) return; // allow normal page scroll unless pinch/ctrl-zoom
    e.preventDefault();
    var rect = vp.getBoundingClientRect();
    var px = e.clientX - rect.left;
    zoomAt(lvl, e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP, px);
  }, { passive: false });

  var dragging = false, startX = 0, startY = 0, startScrollLeft = 0, moved = 0;

  vp.addEventListener('pointerdown', function(e) {
    suppressClick = false;
    var st = zoomState[lvl];
    if (st.scale <= 1.001) return;
    dragging = true; moved = 0;
    startX = e.clientX; startY = e.clientY;
    startScrollLeft = vp.scrollLeft;
    vp.classList.add('panning');
    vp.setPointerCapture(e.pointerId);
  });
  vp.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - startX, dy = e.clientY - startY;
    moved = Math.max(moved, Math.abs(dx), Math.abs(dy));
    vp.scrollLeft = startScrollLeft - dx;
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    vp.classList.remove('panning');
    if (moved > 4) suppressClick = true;
  }
  vp.addEventListener('pointerup', endDrag);
  vp.addEventListener('pointerleave', endDrag);
  vp.addEventListener('pointercancel', endDrag);
});

function goHome() {
  if (navHistory[navHistory.length - 1] !== 'hoofdflow') {
    navHistory.push('hoofdflow');
    showLevel('hoofdflow', false);
  }
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2200);
}

function openLink(code) {
  var url = LINKS[code];
  if (!url) {
    showToast('Nog geen link ingesteld voor ' + code + '.');
    return;
  }
  try { window.top.location.href = url; } catch (e) { window.location.href = url; }
}

document.getElementById('homeBtn').addEventListener('click', goHome);

document.querySelectorAll('.hotspot').forEach(function(el) {
  el.addEventListener('click', function(e) {
    if (suppressClick) { suppressClick = false; e.stopPropagation(); return; }
    if (el.dataset.nav) {
      showLevel(el.dataset.nav, true);
    } else if (el.dataset.link) {
      openLink(el.dataset.link);
    }
  });
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      el.click();
    }
  });
});
